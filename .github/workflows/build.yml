name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SealBox-windows-x64
          - os: macos-latest
            artifact: SealBox-macos-arm64
          - os: ubuntu-22.04
            artifact: SealBox-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow "PySide6>=6.5"

      - name: 安装 7-Zip (Windows)
        if: runner.os == 'Windows'
        run: choco install 7zip -y --no-progress

      - name: 安装 7-Zip (macOS)
        if: runner.os == 'macOS'
        run: brew install sevenzip

      - name: 安装 7-Zip 与 Qt 运行库 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full libegl1 libxkbcommon0 libdbus-1-3

      - name: 构建
        run: python packaging/build.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
