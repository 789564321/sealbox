[project]
name = "sealbox"
version = "0.1.0"
description = "一次性 UUID 密码加密文件：7z / ZIP / 自解压 + 密码 TXT，带窗口、托盘、右键菜单"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PySide6>=6.5"]

[project.scripts]
sealbox = "sealbox.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }
